<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 350" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2a2a"/>
    </marker>
  </defs>
  <rect width="1060" height="350" fill="#ffffff"/>
  <rect x="20" y="20" width="1020" height="310" rx="16" fill="#f7f7f8" stroke="#d8d8db"/>

  <!-- loss -->
  <rect x="430" y="60" width="300" height="50" rx="10" fill="#fdf8e2" stroke="#c9b96a"/>
  <text x="580" y="82" font-size="13" text-anchor="middle" fill="#2a2a2a" font-weight="600">loss = L1 + 0.2 &#183; LPIPS(VGG) + 10&#8315;&#8310; &#183; KL</text>
  <text x="580" y="100" font-size="10.5" text-anchor="middle" fill="#666">Adam &#183; batch 128 &#183; 30 k steps &#8776; 2.2 h on the 5090</text>

  <path d="M 105 190 V 85 H 426" fill="none" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 875 190 V 85 H 734" fill="none" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="435" y1="195" x2="435" y2="114" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="448" y="140" font-size="10.5" fill="#666" font-style="italic">KL</text>

  <!-- input image -->
  <rect x="40" y="190" width="130" height="80" rx="10" fill="#e4e4e8"/>
  <text x="105" y="224" font-size="13.5" text-anchor="middle" fill="#2a2a2a">FFHQ image x</text>
  <text x="105" y="244" font-size="11" text-anchor="middle" fill="#555">128 &#215; 128 &#215; 3</text>

  <line x1="170" y1="230" x2="186" y2="230" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- encoder trapezoid (narrows toward latent) -->
  <polygon points="190,160 350,205 350,255 190,300" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="262" y="222" font-size="15" text-anchor="middle" fill="#26374f" font-weight="600">encoder</text>
  <text x="262" y="241" font-size="11" text-anchor="middle" fill="#44546b">~10 M params</text>
  <text x="262" y="316" font-size="11" text-anchor="middle" fill="#8b3a62" font-style="italic">training only &#8212; never ships</text>

  <line x1="350" y1="230" x2="376" y2="230" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- mu / logvar -->
  <rect x="380" y="192" width="112" height="32" rx="8" fill="#dcd9ec" stroke="#b9b3d6"/>
  <text x="436" y="213" font-size="12" text-anchor="middle" fill="#2a2a2a">&#956; &#183; 16 &#215; 16 &#215; 8</text>
  <rect x="380" y="236" width="112" height="32" rx="8" fill="#dcd9ec" stroke="#b9b3d6"/>
  <text x="436" y="257" font-size="10.5" text-anchor="middle" fill="#2a2a2a">log &#963;&#178; &#183; 16 &#215; 16 &#215; 8</text>

  <line x1="492" y1="208" x2="516" y2="222" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="492" y1="252" x2="516" y2="238" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- reparameterization -->
  <rect x="520" y="212" width="106" height="36" rx="8" fill="#e4e4e8"/>
  <text x="573" y="234" font-size="12" text-anchor="middle" fill="#2a2a2a">z = &#956; + &#963; &#183; &#949;</text>
  <text x="573" y="264" font-size="10" text-anchor="middle" fill="#666">&#949; ~ N(0, 1)</text>

  <line x1="626" y1="230" x2="652" y2="230" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- decoder trapezoid (widens toward image) -->
  <polygon points="656,205 816,160 816,300 656,255" fill="#cfe7c4" stroke="#9dbf8e"/>
  <text x="734" y="222" font-size="15" text-anchor="middle" fill="#2a3d24" font-weight="600">decoder</text>
  <text x="734" y="241" font-size="11" text-anchor="middle" fill="#4a5b43">115 K params</text>
  <text x="734" y="316" font-size="11" text-anchor="middle" fill="#2f6b3a" font-style="italic">ships on the Pico &#183; int8</text>

  <line x1="816" y1="230" x2="836" y2="230" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- reconstruction -->
  <rect x="840" y="190" width="150" height="80" rx="10" fill="#e4e4e8"/>
  <text x="915" y="224" font-size="13.5" text-anchor="middle" fill="#2a2a2a">reconstruction x&#770;</text>
  <text x="915" y="244" font-size="11" text-anchor="middle" fill="#555">128 &#215; 128 &#215; 3</text>

</svg>
