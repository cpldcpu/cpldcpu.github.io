<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 850" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2a2a"/>
    </marker>
  </defs>
  <rect width="1060" height="850" fill="#ffffff"/>

  <!-- ================= Panel A: inference pipeline ================= -->
  <rect x="20" y="20" width="480" height="790" rx="16" fill="#f7f7f8" stroke="#d8d8db"/>

  <!-- image out -->
  <rect x="90" y="60" width="220" height="40" rx="8" fill="#e4e4e8"/>
  <text x="200" y="85" font-size="14.5" text-anchor="middle" fill="#2a2a2a">128 &#215; 128 &#215; 3 image</text>

  <line x1="200" y1="144" x2="200" y2="106" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- decoder trapezoid (wide at top) -->
  <polygon points="100,144 300,144 250,210 150,210" fill="#cfe7c4" stroke="#9dbf8e"/>
  <text x="200" y="174" font-size="15" text-anchor="middle" fill="#2a3d24" font-weight="600">VAE decoder</text>
  <text x="200" y="193" font-size="11.5" text-anchor="middle" fill="#4a5b43">115 K params &#183; int8</text>

  <line x1="200" y1="244" x2="200" y2="214" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="90" y="244" width="220" height="34" rx="8" fill="#dcd9ec" stroke="#b9b3d6"/>
  <text x="200" y="266" font-size="13.5" text-anchor="middle" fill="#2a2a2a">clean latent z&#8320; &#183; 16 &#215; 16 &#215; 8</text>

  <line x1="200" y1="312" x2="200" y2="282" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="90" y="312" width="220" height="34" rx="8" fill="#dcd9ec" stroke="#b9b3d6"/>
  <text x="200" y="334" font-size="13.5" text-anchor="middle" fill="#2a2a2a">velocity v &#183; 16 &#215; 16 &#215; 8</text>

  <line x1="200" y1="380" x2="200" y2="350" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="90" y="380" width="220" height="34" rx="8" fill="#cfe7c4" stroke="#9dbf8e"/>
  <text x="200" y="402" font-size="13.5" text-anchor="middle" fill="#2a2a2a">linear 128 &#8594; 16 &#183; unpatchify</text>

  <line x1="200" y1="448" x2="200" y2="418" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="90" y="448" width="220" height="34" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="200" y="470" font-size="13.5" text-anchor="middle" fill="#2a2a2a">RMSNorm &#183; scale, shift</text>

  <line x1="200" y1="516" x2="200" y2="486" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="90" y="516" width="220" height="60" rx="10" fill="#ffffff" stroke="#2a2a2a" stroke-width="2"/>
  <text x="200" y="542" font-size="16" text-anchor="middle" fill="#111" font-weight="600">DiT Block</text>
  <text x="200" y="562" font-size="12.5" text-anchor="middle" fill="#555">&#215; 8 &#183; dim 128 &#183; 4 heads</text>

  <line x1="200" y1="610" x2="200" y2="580" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="90" y="610" width="220" height="34" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="200" y="628" font-size="12.5" text-anchor="middle" fill="#2a2a2a">patchify 2&#215;2 &#183; linear &#8594; 64 tok &#215; 128</text>
  <text x="200" y="640" font-size="10" text-anchor="middle" fill="#666">+ 2-D sincos positions</text>

  <line x1="200" y1="678" x2="200" y2="648" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="90" y="678" width="220" height="34" rx="8" fill="#dcd9ec" stroke="#b9b3d6"/>
  <text x="200" y="700" font-size="13.5" text-anchor="middle" fill="#2a2a2a">PCG32 noise &#949; &#183; 16 &#215; 16 &#215; 8</text>

  <!-- Euler loop, left side -->
  <path d="M 90 329 H 44 V 627 H 84" fill="none" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="34" y="480" font-size="11.5" fill="#444" text-anchor="middle" transform="rotate(-90 34 480)">Euler: z &#8592; z &#8722; &#916;t &#183; v&#160;&#160;&#160;&#215; K steps (K &#8712; {1, 2, 4, 8})</text>

  <!-- conditioning inputs -->
  <rect x="330" y="660" width="62" height="30" rx="7" fill="#e4e4e8"/>
  <text x="361" y="679" font-size="12" text-anchor="middle" fill="#2a2a2a">t&#8342;</text>
  <rect x="402" y="660" width="62" height="30" rx="7" fill="#e4e4e8"/>
  <text x="433" y="679" font-size="12" text-anchor="middle" fill="#2a2a2a">class y</text>
  <line x1="361" y1="660" x2="361" y2="630" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="433" y1="660" x2="433" y2="630" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="352" y="596" width="90" height="30" rx="7" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="397" y="615" font-size="12.5" text-anchor="middle" fill="#2a2a2a">MLP</text>
  <path d="M 397 596 V 546 H 314" fill="none" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="408" y="566" font-size="11" fill="#555" font-style="italic">c (adaLN)</text>
  <text x="398" y="712" font-size="10.5" text-anchor="middle" fill="#666">folded at export into</text>
  <text x="398" y="725" font-size="10.5" text-anchor="middle" fill="#666">(class, step) tables</text>

  <text x="260" y="836" font-size="14" text-anchor="middle" fill="#333">pico-faces &#8212; latent rectified-flow inference</text>

  <!-- ================= Panel B: DiT block detail ================= -->
  <rect x="520" y="20" width="520" height="790" rx="16" fill="#f7f7f8" stroke="#d8d8db"/>

  <line x1="700" y1="113" x2="700" y2="66" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <circle cx="700" cy="128" r="15" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.6"/>
  <line x1="693" y1="128" x2="707" y2="128" stroke="#2a2a2a" stroke-width="1.6"/>
  <line x1="700" y1="121" x2="700" y2="135" stroke="#2a2a2a" stroke-width="1.6"/>

  <line x1="700" y1="170" x2="700" y2="146" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="625" y="170" width="150" height="32" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="700" y="191" font-size="13" text-anchor="middle" fill="#2a2a2a">scale &#183; &#945;&#8322;</text>

  <line x1="700" y1="230" x2="700" y2="206" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="600" y="230" width="200" height="44" rx="8" fill="#cfe7c4" stroke="#9dbf8e"/>
  <text x="700" y="248" font-size="13" text-anchor="middle" fill="#2a2a2a">pointwise feed-forward</text>
  <text x="700" y="265" font-size="11" text-anchor="middle" fill="#4a5b43">128 &#8594; 512 &#8594; 128 &#183; ReLU&#178;</text>

  <line x1="700" y1="302" x2="700" y2="278" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="625" y="302" width="150" height="32" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="700" y="323" font-size="13" text-anchor="middle" fill="#2a2a2a">scale, shift &#183; &#947;&#8322;, &#946;&#8322;</text>

  <line x1="700" y1="362" x2="700" y2="338" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="625" y="362" width="150" height="32" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="700" y="383" font-size="13" text-anchor="middle" fill="#2a2a2a">RMSNorm</text>

  <line x1="700" y1="415" x2="700" y2="398" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <circle cx="700" cy="430" r="15" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.6"/>
  <line x1="693" y1="430" x2="707" y2="430" stroke="#2a2a2a" stroke-width="1.6"/>
  <line x1="700" y1="423" x2="700" y2="437" stroke="#2a2a2a" stroke-width="1.6"/>

  <line x1="700" y1="472" x2="700" y2="448" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="625" y="472" width="150" height="32" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="700" y="493" font-size="13" text-anchor="middle" fill="#2a2a2a">scale &#183; &#945;&#8321;</text>

  <line x1="700" y1="532" x2="700" y2="508" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="600" y="532" width="200" height="44" rx="8" fill="#fbd5a4" stroke="#dcb076"/>
  <text x="700" y="550" font-size="13" text-anchor="middle" fill="#2a2a2a">multi-head self-attention</text>
  <text x="700" y="567" font-size="11" text-anchor="middle" fill="#7a5c2e">4 heads &#215; 32 &#183; qk-RMSNorm</text>

  <line x1="700" y1="604" x2="700" y2="580" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="625" y="604" width="150" height="32" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="700" y="625" font-size="13" text-anchor="middle" fill="#2a2a2a">scale, shift &#183; &#947;&#8321;, &#946;&#8321;</text>

  <line x1="700" y1="664" x2="700" y2="640" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="625" y="664" width="150" height="32" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="700" y="685" font-size="13" text-anchor="middle" fill="#2a2a2a">RMSNorm</text>

  <line x1="700" y1="724" x2="700" y2="700" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="600" y="724" width="200" height="34" rx="8" fill="#e4e4e8"/>
  <text x="700" y="746" font-size="13" text-anchor="middle" fill="#2a2a2a">input tokens &#183; 64 &#215; 128</text>

  <!-- residual skips -->
  <circle cx="700" cy="712" r="3" fill="#2a2a2a"/>
  <path d="M 700 712 H 560 V 430 H 681" fill="none" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="700" cy="406" r="3" fill="#2a2a2a"/>
  <path d="M 700 406 H 560 V 128 H 681" fill="none" stroke="#2a2a2a" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- conditioning tower -->
  <rect x="830" y="724" width="180" height="34" rx="8" fill="#e4e4e8"/>
  <text x="920" y="746" font-size="12" text-anchor="middle" fill="#2a2a2a">c = emb(t&#8342;) + emb(y)</text>
  <line x1="920" y1="724" x2="920" y2="700" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="845" y="664" width="150" height="32" rx="8" fill="#d7e2f4" stroke="#a9bedf"/>
  <text x="920" y="685" font-size="12" text-anchor="middle" fill="#2a2a2a">MLP &#183; SiLU, linear</text>

  <line x1="920" y1="664" x2="920" y2="186" stroke="#2a2a2a" stroke-width="1.4"/>
  <line x1="920" y1="620" x2="779" y2="620" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="920" y1="488" x2="779" y2="488" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="920" y1="318" x2="779" y2="318" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="920" y1="186" x2="779" y2="186" stroke="#2a2a2a" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="920" y="775" font-size="10.5" text-anchor="middle" fill="#666">zero-init: &#945;, &#947;, &#946; start at 0 (adaLN-zero)</text>

  <!-- fold note -->
  <rect x="830" y="60" width="200" height="106" rx="10" fill="#fdf8e2" stroke="#8a8a90" stroke-dasharray="5 4"/>
  <text x="930" y="80" font-size="12" text-anchor="middle" fill="#2a2a2a" font-weight="600">folded at export</text>
  <text x="930" y="98" font-size="10.5" text-anchor="middle" fill="#444">tower evaluated for every</text>
  <text x="930" y="112" font-size="10.5" text-anchor="middle" fill="#444">(class, step) pair:</text>
  <text x="930" y="128" font-size="10.5" text-anchor="middle" fill="#444">&#947;, &#946; &#8594; norm gain/bias tables</text>
  <text x="930" y="142" font-size="10.5" text-anchor="middle" fill="#444">&#945; &#8594; requant multipliers</text>
  <text x="930" y="158" font-size="10.5" text-anchor="middle" fill="#444">&#8658; zero device compute</text>

  <text x="780" y="836" font-size="14" text-anchor="middle" fill="#333">DiT block with adaLN-zero (training view)</text>
</svg>
