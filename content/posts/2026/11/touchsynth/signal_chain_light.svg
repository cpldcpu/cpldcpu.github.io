    .h{font-size:15px;font-weight:700;letter-spacing:1.6px;fill:#A8601F}
    .cop{fill:#A8601F;font-size:16px;font-weight:600}
    </style><rect width="1270" height="400" fill="#FFFFFF"/><rect class="part" x="40" y="35.0" width="140" height="70" rx="5"/><text class="bt" x="110.0" y="67" text-anchor="middle">DCO</text><text class="n" x="110.0" y="88" text-anchor="middle">saw integrator</text><rect class="part" x="240" y="35.0" width="120" height="70" rx="5"/><text class="bt" x="300.0" y="67" text-anchor="middle">Mixer</text><text class="n" x="300.0" y="88" text-anchor="middle">passive</text><rect class="part" x="420" y="35.0" width="200" height="70" rx="5"/><text class="bt" x="520.0" y="67" text-anchor="middle">Ladder VCF</text><text class="n" x="520.0" y="88" text-anchor="middle">24 dB/oct</text><rect class="part" x="680" y="35.0" width="140" height="70" rx="5"/><text class="bt" x="750.0" y="67" text-anchor="middle">Output amp</text><text class="n" x="750.0" y="88" text-anchor="middle">gain 11</text><rect class="part" x="900" y="35.0" width="140" height="70" rx="5"/><text class="bt" x="970.0" y="67" text-anchor="middle">VCA</text><text class="n" x="970.0" y="88" text-anchor="middle">differential pair</text><polyline class="w" points="180,70 231,70"/><polygon class="dot" points="240,70 227,76 227,64"/><polyline class="w" points="360,70 411,70"/><polygon class="dot" points="420,70 407,76 407,64"/><polyline class="w" points="620,70 671,70"/><polygon class="dot" points="680,70 667,76 667,64"/><polyline class="w" points="820,70 891,70"/><polygon class="dot" points="900,70 887,76 887,64"/><polyline class="w" points="1040,70 1141,70"/><polygon class="dot" points="1150,70 1137,76 1137,64"/><text class="net" x="1160" y="67" text-anchor="start">LINE OUT</text><text class="n" x="1160" y="88" text-anchor="start">1.2 Vpp</text><circle class="dot" cx="860" cy="70" r="4.5"/><polyline class="w" points="860,70 860,175 809,175"/><polygon class="dot" points="800,175 813,169 813,181"/><rect class="part" x="640" y="143.0" width="160" height="64" rx="5"/><text class="bt" x="720.0" y="172" text-anchor="middle">Resonance</text><text class="n" x="720.0" y="193" text-anchor="middle">feedback gain</text><polyline class="w" points="640,175 570,175 570,114"/><polygon class="dot" points="570,105 576,118 564,118"/><polyline class="w ctl" points="110,300 110,114"/><polygon class="cop" points="110,105 116,118 104,118"/><text class="cop" x="122" y="262" text-anchor="start">reset pulse</text><text class="cop" x="122" y="282" text-anchor="start">CV_AMP</text><polyline class="w ctl" points="300,300 300,114"/><polygon class="cop" points="300,105 306,118 294,118"/><text class="cop" x="312" y="262" text-anchor="start">pulse, sub,</text><text class="cop" x="312" y="282" text-anchor="start">noise</text><polyline class="w ctl" points="480,300 480,114"/><polygon class="cop" points="480,105 486,118 474,118"/><text class="cop" x="492" y="272" text-anchor="start">CV_CUT</text><polyline class="w ctl" points="720,300 720,216"/><polygon class="cop" points="720,207 726,220 714,220"/><text class="cop" x="732" y="272" text-anchor="start">CV_RES</text><polyline class="w ctl" points="970,300 970,114"/><polygon class="cop" points="970,105 976,118 964,118"/><text class="cop" x="982" y="262" text-anchor="start">CV_VCA</text><text class="cop" x="982" y="282" text-anchor="start">8-bit trim</text><circle class="dot" cx="1090" cy="70" r="4.5"/><polyline class="w ctl dashed" points="1090,70 1090,291"/><polygon class="cop" points="1090,300 1084,287 1096,287"/><text class="cop" x="1102" y="262" text-anchor="start">loopback</text><text class="cop" x="1102" y="282" text-anchor="start">to the ADC</text><rect class="part" x="40" y="300" width="1190" height="76" rx="5"/><text class="bt" x="60" y="332" text-anchor="start">CH32V microcontroller</text><text class="n" x="60" y="356" text-anchor="start">TIM2: pitch · TIM1: four 12-bit PWM control voltages · envelopes, LFO, glide and arpeggiator at 1 kHz · 16 touch pads · 16 LEDs</text></svg>