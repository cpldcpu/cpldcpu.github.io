    </style><rect width="1560" height="716" fill="#FFFFFF"/><text class="h" x="30" y="40" text-anchor="start">DESIGN · 26–27 SEP</text><text class="n" x="1530" y="40" text-anchor="end">19 hours from the first question to the ordered board</text><rect class="part" x="30" y="92" width="215" height="96" rx="5"/><text class="cop" x="30" y="82" text-anchor="start">Sat 20:59</text><text class="bt" x="137.5" y="124" text-anchor="middle">Concept and parts</text><text class="n" x="137.5" y="148" text-anchor="middle">JLCPCB part lists,</text><text class="n" x="137.5" y="168" text-anchor="middle">idea, specification</text><rect class="part" x="285" y="92" width="215" height="96" rx="5"/><text class="cop" x="285" y="82" text-anchor="start">21:53</text><text class="bt" x="392.5" y="124" text-anchor="middle">Circuit simulation</text><text class="n" x="392.5" y="148" text-anchor="middle">ngspice, seven blocks,</text><text class="n" x="392.5" y="168" text-anchor="middle">verification plan</text><rect class="part" x="540" y="92" width="215" height="96" rx="5"/><text class="cop" x="540" y="82" text-anchor="start">23:00</text><text class="bt" x="647.5" y="124" text-anchor="middle">Behavioural model</text><text class="n" x="647.5" y="148" text-anchor="middle">fast model of the voice:</text><text class="n" x="647.5" y="168" text-anchor="middle">audio clips, demo tunes</text><rect class="part" x="795" y="92" width="215" height="96" rx="5"/><text class="cop" x="795" y="82" text-anchor="start">23:24</text><text class="bt" x="902.5" y="124" text-anchor="middle">Schematic</text><text class="n" x="902.5" y="148" text-anchor="middle">generated from design.py</text><text class="n" x="902.5" y="168" text-anchor="middle">into KiCad</text><rect class="part" x="1050" y="92" width="215" height="96" rx="5"/><text class="cop" x="1050" y="82" text-anchor="start">Sun 00:01</text><text class="bt" x="1157.5" y="124" text-anchor="middle">PCB</text><text class="n" x="1157.5" y="148" text-anchor="middle">scripted placement,</text><text class="n" x="1157.5" y="168" text-anchor="middle">autorouter, silkscreen art</text><rect class="part" x="1305" y="92" width="215" height="96" rx="5"/><text class="cop" x="1305" y="82" text-anchor="start">15:45</text><text class="bt" x="1412.5" y="124" text-anchor="middle">Fab data, order</text><text class="n" x="1412.5" y="148" text-anchor="middle">Gerbers, BOM, placement</text><text class="n" x="1412.5" y="168" text-anchor="middle">ordered at 16:04</text><polyline class="w" points="245,140 276,140"/><polygon class="dot" points="285,140 272,146 272,134"/><polyline class="w" points="500,140 531,140"/><polygon class="dot" points="540,140 527,146 527,134"/><polyline class="w" points="755,140 786,140"/><polygon class="dot" points="795,140 782,146 782,134"/><polyline class="w" points="1010,140 1041,140"/><polygon class="dot" points="1050,140 1037,146 1037,134"/><polyline class="w" points="1265,140 1296,140"/><polygon class="dot" points="1305,140 1292,146 1292,134"/><polyline class="w ctl" points="370,188 370,216 137,216 137,197"/><polygon class="cop" points="137,188 143,201 131,201"/><text class="cop" x="254" y="238" text-anchor="middle">five circuit changes</text><polyline class="w ctl" points="647,188 647,216 430,216 430,197"/><polygon class="cop" points="430,188 436,201 424,201"/><text class="cop" x="545" y="238" text-anchor="middle">a CV-filter error found</text><text class="cop" x="1157" y="216" text-anchor="middle">two layers would not route:</text><text class="cop" x="1157" y="237" text-anchor="middle">four layers, new floorplan</text><rect class="grp" x="285" y="260" width="980" height="62" rx="5"/><text class="bs" x="305" y="286" text-anchor="start">One Python file holds parts, values and nets.</text><text class="n" x="305" y="308" text-anchor="start">Scripts check each step against it: simulation = schematic · KiCad netlist = design · ERC and DRC clean · firmware pins = netlist</text><polyline class="w ctl dashed" points="1417,188 1417,372 280,372 280,447"/><polygon class="cop" points="280,456 274,443 286,443"/><text class="cop" x="300" y="360" text-anchor="start">three weeks: boards made and assembled at JLCPCB</text><text class="n" x="1397" y="360" text-anchor="end">meanwhile: design report and firmware 0.1</text><text class="h" x="30" y="408" text-anchor="start">HARDWARE · 17–18 OCT</text><rect class="part" x="30" y="456" width="268" height="96" rx="5"/><text class="cop" x="30" y="446" text-anchor="start">Sat 15:54</text><text class="bt" x="164.0" y="488" text-anchor="middle">Bring-up, no MCU</text><text class="n" x="164.0" y="512" text-anchor="middle">supply and bias voltages</text><text class="n" x="164.0" y="532" text-anchor="middle">against simulated values</text><text class="cop" x="164.0" y="580" text-anchor="middle">two model errors found,</text><text class="n" x="164.0" y="600" text-anchor="middle">no fault on the board</text><rect class="part" x="338" y="456" width="268" height="96" rx="5"/><text class="cop" x="338" y="446" text-anchor="start">18:05</text><text class="bt" x="472.0" y="488" text-anchor="middle">MCU and firmware</text><text class="n" x="472.0" y="512" text-anchor="middle">CH32V006 soldered, flashed,</text><text class="n" x="472.0" y="532" text-anchor="middle">console over the debug wire</text><text class="cop" x="472.0" y="580" text-anchor="middle">one solder bridge,</text><text class="n" x="472.0" y="600" text-anchor="middle">a few firmware bugs</text><rect class="part" x="646" y="456" width="268" height="96" rx="5"/><text class="cop" x="646" y="446" text-anchor="start">18:46</text><text class="bt" x="780.0" y="488" text-anchor="middle">Functional tests</text><text class="n" x="780.0" y="512" text-anchor="middle">run from the PC through</text><text class="n" x="780.0" y="532" text-anchor="middle">the audio loopback</text><text class="cop" x="780.0" y="580" text-anchor="middle">all executed tests pass,</text><text class="n" x="780.0" y="600" text-anchor="middle">noise marginal</text><rect class="part" x="954" y="456" width="268" height="96" rx="5"/><text class="cop" x="954" y="446" text-anchor="start">19:17</text><text class="bt" x="1088.0" y="488" text-anchor="middle">Recordings</text><text class="n" x="1088.0" y="512" text-anchor="middle">line out via oscilloscope,</text><text class="n" x="1088.0" y="532" text-anchor="middle">one part per take, then mixed</text><text class="cop" x="1088.0" y="580" text-anchor="middle">five multitrack pieces,</text><text class="n" x="1088.0" y="600" text-anchor="middle">30 single-voice parts</text><rect class="part" x="1262" y="456" width="268" height="96" rx="5"/><text class="cop" x="1262" y="446" text-anchor="start">Sun 10:32</text><text class="bt" x="1396.0" y="488" text-anchor="middle">Extension</text><text class="n" x="1396.0" y="512" text-anchor="middle">pulse output as PWM DAC,</text><text class="n" x="1396.0" y="532" text-anchor="middle">digital kettle drum</text><text class="cop" x="1396.0" y="580" text-anchor="middle">firmware only,</text><text class="n" x="1396.0" y="600" text-anchor="middle">no board change</text><polyline class="w" points="298,504 329,504"/><polygon class="dot" points="338,504 325,510 325,498"/><polyline class="w" points="606,504 637,504"/><polygon class="dot" points="646,504 633,510 633,498"/><polyline class="w" points="914,504 945,504"/><polygon class="dot" points="954,504 941,510 941,498"/><polyline class="w" points="1222,504 1253,504"/><polygon class="dot" points="1262,504 1249,510 1249,498"/><polyline class="ax" points="30,636 1530,636"/><text class="h" x="30" y="666" text-anchor="start">HUMAN</text><text class="n" x="110" y="666" text-anchor="start">about 130 prompts: goals and choices, soldering, bench measurements, listening</text><text class="h" x="30" y="692" text-anchor="start">CLAUDE</text><text class="n" x="110" y="692" text-anchor="start">circuits, simulations, layout scripts, firmware, bench tools, tests, music and report</text></svg>